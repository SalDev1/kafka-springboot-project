version: '3.8'

# Docker-compose.yml --> A one big script to run container instances of multiple required software services.
# In this, we want to run zookeeper, kafka1, kafka2, kafka3
services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka1:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181  #Tells Kafka where Zookeeper is connected.

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT  # Maps each listener name to the communication protocol
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092  # Defines Network address on where the Kafka listens for incoming connections
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://localhost:9092 # These address helps Kafka telling clients to use these ports when connecting back to it.

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL  # Which listener should Kafka brokers use to communicate with each other?

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3  # Keeps 3 Replicas of this internal topic
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3  # Keeps 3 replicas of this transaction state data.
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2 # 2 means Kafka requires at least 2 replicas to be in sync for transaction-state writes.

  kafka2:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29093,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29093,EXTERNAL://localhost:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

  kafka3:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29094,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29094,EXTERNAL://localhost:9094

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
#
#  1. KAFKA_BROKER_ID
#  ↓
#  "Who am I?"
#
#  2. KAFKA_LISTENERS
#  ↓
#  "Where do I listen?"
#
#  3. KAFKA_ADVERTISED_LISTENERS
#  ↓
#  "What address should I tell others?"
#
#  4. KAFKA_INTER_BROKER_LISTENER_NAME
#  ↓
#  "Which address should brokers use to talk to each other?"